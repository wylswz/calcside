name: llm_anthropic
version: 0.1.0
description: Anthropic LLM provider — Messages API with tool-based structured output.
interface: llm
icon: icon.png
dependencies: [net]
ops:
  - name: respond
    doc: Message completion; returns {text, finish_reason, usage:{input_tokens,output_tokens}}
    params: [messages, model, options]
  - name: structured
    doc: Forced tool call parsed as JSON conforming to schema; returns the parsed value
    params: [messages, schema, model]
  - name: score
    doc: Score content against criteria; returns {score, rationale}
    params: [content, criteria, scale, model]
  - name: choose
    doc: Pick the best option for an instruction; returns {index, option, rationale}
    params: [instruction, options, model]
  - name: rank
    doc: Rank items for an instruction; returns {order, rationale}
    params: [instruction, items, model]
config:
  - name: base_url
    type: string
    doc: Anthropic API base URL
    default: https://api.anthropic.com
  - name: api_key
    type: secret
    doc: Anthropic API key, sk-ant-... (secret reference)
    default: "{{secrets.ANTHROPIC_API_KEY}}"
  - name: model
    type: string
    doc: Default model
    default: claude-haiku-4-5
  - name: max_tokens
    type: int
    doc: max_tokens sent on every request (the API requires it)
    default: 4096
