name: llm
version: 0.1.0
capability: llm
description: LLM capability — consumes workspace provider extensions through the provider protocol.
icon: icon.png
dependencies: [net]
ops:
  - name: providers
    doc: List configured provider names for this instance.
    params: []
  - name: models
    doc: List a provider's model ids.
    params: [provider]
  - name: respond
    doc: Chat completion; returns {text, finish_reason, usage:{input_tokens,output_tokens}}
    params: [provider, messages, model, options]
  - name: structured
    doc: Completion parsed as JSON conforming to schema; returns the parsed value
    params: [provider, messages, schema, model]
  - name: score
    doc: Score content against criteria; returns {score, rationale}
    params: [provider, content, criteria, scale, model]
  - name: choose
    doc: Pick the best option for an instruction; returns {index, option, rationale}
    params: [provider, instruction, options, model]
  - name: rank
    doc: Rank items for an instruction; returns {order, rationale}
    params: [provider, instruction, items, model]
