name: llm_openai_compat
version: 0.1.0
description: OpenAI-compatible LLM provider (vLLM, Ollama, LiteLLM, gateways) — chat completions with optional prompt-based structured output.
interface: llm
icon: icon.png
dependencies: [net]
ops:
  - name: respond
    doc: Chat completion; returns {text, finish_reason, usage:{input_tokens,output_tokens}}
    params: [messages, model, options]
  - name: structured
    doc: Completion parsed as JSON; schema enforced by prompt, verified locally
    params: [messages, schema, model]
  - name: score
    doc: Score content against criteria; returns {score, rationale}
    params: [content, criteria, scale, model]
  - name: choose
    doc: Pick the best option for an instruction; returns {index, option, rationale}
    params: [instruction, options, model]
  - name: rank
    doc: Rank items for an instruction; returns {order, rationale}
    params: [instruction, items, model]
config:
  - name: base_url
    type: string
    doc: OpenAI-compatible API base URL, e.g. https://llm.internal/v1 (required)
    default: ""
  - name: api_key
    type: secret
    doc: API key for the endpoint (secret reference)
    default: "{{secrets.LLM_API_KEY}}"
  - name: model
    type: string
    doc: Default model served by the endpoint (required)
    default: ""
  - name: json_schema
    type: bool
    doc: Send response_format json_schema; false uses prompt-and-parse
    default: false
