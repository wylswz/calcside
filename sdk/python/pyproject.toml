[project]
name = "calcside"
version = "0.1.0"
description = "Client SDK and LangChain middleware for the calcside Starlark sandbox"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1", "typing-extensions>=4"]

[project.optional-dependencies]
langchain = ["langchain>=1.0.0,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.26", "ruff>=0.12", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calcside"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
