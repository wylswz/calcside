{{- include "calcside.validate" . -}}
{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "calcside.fullname" . }}
{{- $name := printf "%s-secrets" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $workerKey := .Values.secrets.workerSharedKey }}
{{- if and (not $workerKey) $existing (hasKey $existing.data "worker-shared-key") }}
{{- $workerKey = index $existing.data "worker-shared-key" | b64dec }}
{{- end }}
{{- if not $workerKey }}
{{- $workerKey = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "calcside.labels" . | nindent 4 }}
type: Opaque
stringData:
  worker-shared-key: {{ $workerKey | quote }}
  {{- with .Values.secrets.secretKey }}
  secret-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  google-client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and (eq .Values.database.driver "postgres") (not .Values.database.postgres.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calcside.postgresSecretName" . }}
  labels:
    {{- include "calcside.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ required "database.postgres.dsn is required" .Values.database.postgres.dsn | quote }}
{{- end }}
