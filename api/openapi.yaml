openapi: 3.0.3
info:
  title: calcside API
  version: "1.0.0"
  description: |
    REST API for the calcside Starlark sandbox.

    Authentication: `bearerAuth` (API key `cs_…`) or `cookieAuth` (session
    cookie `cs_session`). Cookie-authenticated mutating requests (any
    non-GET/HEAD) must send `X-Requested-With: calcside` (CSRF guard).
    API-key-authenticated requests are forbidden on the session-only
    endpoints `/api/v1/keys*` and `/api/v1/secrets*` (403).

    In dev mode (`--dev`) requests without credentials authenticate as
    the `anonymous` user; the same CSRF rule applies.
servers:
  - url: /
tags:
  - name: auth-raw
    description: Cookie/redirect auth endpoints (hand-written, not generated)
  - name: auth
  - name: meta
  - name: keys
  - name: instances
  - name: audit
  - name: policies
  - name: llm-providers
  - name: secrets
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [meta]
      security: []
      responses:
        '200':
          description: liveness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/v1/auth/config:
    get:
      operationId: authConfig
      tags: [auth]
      security: []
      responses:
        '200':
          description: which login methods are enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
  /api/v1/me:
    get:
      operationId: me
      tags: [auth]
      responses:
        '200':
          description: current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeInfo'
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's local password and revoke their sessions
      description: Requires a session and the current password. API keys and anonymous users cannot change passwords. Bootstrap configuration never resets an existing password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, writeOnly: true }
                new_password: { type: string, writeOnly: true, description: 8-72 UTF-8 bytes }
      responses:
        '200':
          description: Password updated; all sessions revoked and session cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/capabilities:
    get:
      operationId: capabilities
      tags: [meta]
      responses:
        '200':
          description: registered capability factories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityCatalog'
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/editor/metadata:
    get:
      operationId: editorMetadata
      tags: [meta]
      responses:
        '200':
          description: Restricted Rego symbols and registered capability documentation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditorMetadata' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/editor/contracts/infer:
    post:
      operationId: inferContract
      tags: [meta]
      summary: Infer a JSON Schema from a raw JSON sample.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InferContractRequest' }
      responses:
        '200':
          description: Inferred canonical schema text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/editor/contracts/validate:
    post:
      operationId: validateContract
      tags: [meta]
      summary: Validate and canonicalize a JSON Schema draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateContractRequest' }
      responses:
        '200':
          description: Canonicalized schema text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractDocument' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/extensions:
    get:
      operationId: listExtensions
      tags: [meta]
      responses:
        '200':
          description: loadable extensions under the server's ext roots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionCatalog'
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/extensions/icons/{icon_id}:
    get:
      operationId: extensionIcon
      tags: [meta]
      parameters:
        - name: icon_id
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Validated packaged PNG icon
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/keys:
    get:
      operationId: listKeys
      tags: [keys]
      description: Session or anonymous (dev) auth only — API keys get 403.
      parameters:
        - name: workspace
          in: query
          schema: { type: string, description: workspace id; omitted = personal workspace }
      responses:
        '200':
          description: the user's API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createKey
      tags: [keys]
      parameters:
        - name: workspace
          in: query
          schema: { type: string, description: workspace id; omitted = personal workspace }
      description: Session or anonymous (dev) auth only — API keys get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: created key; `secret` is shown only once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKey'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/keys/{id}:
    delete:
      operationId: deleteKey
      tags: [keys]
      description: Session or anonymous (dev) auth only — API keys get 403.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/instances:
    get:
      operationId: listInstances
      tags: [instances]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InstanceStatus' }
        - name: workspace
          in: query
          schema: { type: string, description: workspace id; omitted = personal workspace }
        - name: shared
          in: query
          schema: { type: boolean, description: list instances shared with you instead (sessions only) }
      responses:
        '200':
          description: the user's instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancesResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createInstance
      tags: [instances]
      parameters:
        - name: workspace
          in: query
          schema: { type: string, description: workspace id; omitted = personal workspace }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceSpec'
      responses:
        '201':
          description: created instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}:
    get:
      operationId: getInstance
      tags: [instances]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteInstance
      tags: [instances]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/keepalive:
    post:
      operationId: keepalive
      tags: [instances]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: TTL bumped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/exec:
    post:
      operationId: exec
      tags: [instances]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: execution result (script errors return 200 with error field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/files:
    get:
      operationId: files
      tags: [instances]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: path
          in: query
          schema: { type: string }
        - name: list_only
          in: query
          description: Only list directories; never read file contents. Used by path completion.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: directory listing or file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilesResult'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      operationId: uploadFile
      tags: [instances]
      description: >-
        Upload one file into the instance's virtual filesystem. The body is the
        file's raw bytes (max 1 MiB); `path` is the explicit destination under
        /work. Existing files are rejected with 409 conflict unless
        `overwrite=true`. Runs the same Gate/policy/quota checks as a scripted
        fs.write and is audited identically.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: path
          in: query
          required: true
          description: Destination path under /work (relative paths resolve there).
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: overwrite
          in: query
          description: Replace an existing file. Default false returns 409 on conflict.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Write receipt — never contains the uploaded contents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResult'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/config:
    get:
      operationId: artifactConfig
      tags: [meta]
      responses:
        '200':
          description: Artifact limits and enabled HTML preview modes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactConfig' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/artifacts/preview:
    post:
      operationId: previewArtifact
      tags: [instances]
      description: Read and redact one bounded text file; rendered HTML automatically inlines referenced local JS and CSS within the entry directory into a short-lived isolated snapshot.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, minLength: 1, maxLength: 1024 }
                mode: { type: string, enum: [source, static, interactive], default: source }
      responses:
        '200':
          description: Bounded redacted source, CSV table, or isolated HTML snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPreview' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/artifacts/export:
    post:
      operationId: exportArtifacts
      tags: [instances]
      description: >-
        All-or-nothing export of authorized redacted UTF-8 files. ZIP accepts files
        and directories and preserves paths relative to /work. No binary export,
        persistence, partial archives, or implicit spreadsheet formula rewriting.
        Successful preparation does not guarantee delivery to the client.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paths, format]
              properties:
                paths:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, minLength: 1, maxLength: 1024 }
                format: { type: string, enum: [file, zip] }
      responses:
        '200':
          description: Complete attachment prepared before response headers are written
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Calcside-Redacted:
              schema: { type: boolean }
            X-Calcside-File-Count:
              schema: { type: integer }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/prompt:
    get:
      operationId: instancePrompt
      tags: [instances]
      description: >-
        Server-generated agent system prompt describing this instance's
        granted capabilities, env, secrets (names/domains only) and
        limits. The instance must be live and running: the prompt
        describes its effective in-memory config, so a deleted/expired
        instance returns 409 not_running (404 when it no longer exists at
        all, same as exec).
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: tool_prefix
          in: query
          description: prefix used for tool names in the prompt (default calcside_)
          schema:
            type: string
            pattern: '^[A-Za-z0-9_]{0,32}$'
            default: calcside_
      responses:
        '200':
          description: generated prompt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePrompt'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/completions:
    get:
      operationId: instanceCompletions
      tags: [instances]
      description: Bounded symbol metadata from a live owned instance; no variable or secret values.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Available symbols and environment key names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionContext' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/inspect:
    get:
      operationId: instanceInspect
      tags: [instances]
      description: >-
        Snapshot of the instance's live Starlark globals (variable name
        to its repr, with secret values scrubbed) and, when the instance
        runs in its own cgroup, its memory usage. The instance must be
        live and running; a deleted/expired instance returns 409
        not_running (404 when it no longer exists at all, same as exec).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: globals snapshot and resource usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceInspect'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/instances/{id}/executions:
    get:
      operationId: listExecutions
      tags: [instances]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: executions for the instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionsResponse'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/executions/{id}:
    get:
      operationId: getExecution
      tags: [instances]
      description: single execution including the full submitted code
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: execution detail with full code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDetail'
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/workspaces:
    post:
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: created workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      description: the caller's workspaces (sessions list all memberships; keys get their one workspace)
      responses:
        '200':
          description: workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesResponse'
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}:
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: renamed workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/members:
    get:
      operationId: listMembers
      tags: [workspaces]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: addMember
      tags: [workspaces]
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role: { $ref: '#/components/schemas/MemberRole' }
      responses:
        '201':
          description: added member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/members/{user_id}:
    put:
      operationId: setMemberRole
      tags: [workspaces]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/MemberRole' }
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMember
      tags: [workspaces]
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
