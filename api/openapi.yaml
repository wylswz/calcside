        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Configured administrator credentials; only accepted by POST /auth/basic/login. Use HTTPS.
    bearerAuth:
      type: http
      scheme: bearer
      description: API key `cs_…`
    cookieAuth:
      type: apiKey
      in: cookie
      name: cs_session
      description: "Session cookie; mutating requests need `X-Requested-With: calcside`."
  schemas:
    # --- enums (mirror internal/types; drift-checked by a Go test) ---
    InstanceStatus:
      type: string
      enum: [running, deleted, expired, lost]
    ExecStatus:
      type: string
      enum: [ok, error]
    ExecErrorType:
      type: string
      enum: [syntax, runtime, policy_denied, out_of_scope, timeout, step_limit, memory_limit]
    Decision:
      type: string
      enum: [allow, deny]
    Phase:
      type: string
      description: audit event phase; "" = no phase (runtime error / out of scope)
      enum: ['', before, after]
    CapabilityName:
      type: string
      enum: [fs, net, io, ext, interrupt]
    HTTPMethod:
      type: string
      enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    SecretSource:
      type: string
      enum: [vault, inline]
    APIErrorCode:
      type: string
      enum: [already_resolved, auth_failed, bad_capability, bad_policy, bad_request, bad_secret, bad_spec, conflict, csrf, forbidden, fs_error, internal, method_not_allowed, no_fs, not_found, not_running, secrets_disabled, too_large, too_many, unauthorized]
    FieldType:
      type: string
      enum: [int, bool, string, string_list, string_map]
    AuthKind:
      type: string
      enum: [session, api_key, anonymous]
    # --- models ---
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/APIErrorCode' }
            message: { type: string }
    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
    AuthConfig:
      type: object
      required: [google, basic, dev_mode, secrets]
      properties:
        google: { type: boolean }
        basic: { type: boolean, description: local password login enabled (bootstrap credentials or existing database users) }
        dev_mode: { type: boolean, description: dev mode — anonymous login, no credentials needed }
        secrets: { type: boolean, description: vault secrets enabled (--secret-key set) }
    User:
      type: object
      required: [id, email, name, is_admin, has_password, created_at, last_login_at]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        google_sub: { type: string }
        is_admin: { type: boolean, description: persisted administrator identity }
        username: { type: string, description: independent local login name }
        has_password: { type: boolean, description: whether this account can change a local password }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    MeInfo:
      type: object
      required: [user, via_key, kind]
      properties:
        user: { $ref: '#/components/schemas/User' }
        via_key: { type: boolean }
        kind: { $ref: '#/components/schemas/AuthKind' }
    CompletionSymbol:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
        detail: { type: string }
        doc: { type: string }
        params:
          type: array
          items: { type: string }
    CompletionContext:
      type: object
      required: [symbols, env_keys, truncated]
      properties:
        symbols:
          type: array
          items: { $ref: '#/components/schemas/CompletionSymbol' }
        env_keys:
          type: array
          items: { type: string }
        truncated: { type: boolean }
    ContractDocument:
      type: object
      required: [schema]
      properties:
        schema:
          type: string
          description: Canonical JSON schema text.
    InferContractRequest:
      type: object
      required: [sample]
      properties:
        sample:
          type: string
          maxLength: 65536
          description: Raw JSON text of the sample document.
    ValidateContractRequest:
      type: object
      required: [schema]
      properties:
        schema:
          type: string
          maxLength: 65536
          description: Raw JSON schema text to normalize.
    EditorMetadata:
      type: object
      required: [rego, capabilities, utilities]
      properties:
        utilities:
          type: array
          items: { $ref: '#/components/schemas/CompletionSymbol' }
        rego:
          type: array
          items: { $ref: '#/components/schemas/CompletionSymbol' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityDoc' }
    OpDoc:
      type: object
      properties:
        name: { type: string }
        doc: { type: string }
        params:
          type: array
          items: { type: string }
        policy_args:
          type: object
          additionalProperties: { type: string }
        result_meta:
          type: object
          additionalProperties: { type: string }
    FieldDoc:
      type: object
      properties:
        name: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        doc: { type: string }
        default: { }
    CapabilityDoc:
      type: object
      properties:
        name: { $ref: '#/components/schemas/CapabilityName' }
        ops:
          type: array
          items: { $ref: '#/components/schemas/OpDoc' }
        config_fields:
          type: array
          items: { $ref: '#/components/schemas/FieldDoc' }
    CapabilityCatalog:
      type: object
      properties:
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityDoc' }
    ExtConfigField:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, description: 'a FieldType value or "secret"' }
        doc: { type: string }
        default: { }
    ArtifactConfig:
      type: object
      required: [html_enabled, interactive_enabled, max_file_bytes, max_total_bytes, max_files, preview_ttl_seconds]
      properties:
        html_enabled: { type: boolean }
        interactive_enabled: { type: boolean }
        max_file_bytes: { type: integer }
        max_total_bytes: { type: integer }
        max_files: { type: integer }
        preview_ttl_seconds: { type: integer }
    ArtifactPreview:
      type: object
      required: [path, kind, source, source_truncated, redacted, size]
      properties:
        path: { type: string }
        kind: { type: string, enum: [text, csv, json, html] }
        source: { type: string }
        source_truncated: { type: boolean }
        redacted: { type: boolean }
        size: { type: integer }
        csv_rows:
          type: array
          items:
            type: array
            items: { type: string }
        csv_total_rows: { type: integer }
        csv_truncated: { type: boolean }
        preview_error: { type: string }
        preview_url: { type: string, description: Short-lived bearer URL; do not log or share it }
        expires_at: { type: string, format: date-time }
        interactive: { type: boolean }
        sanitized: { type: boolean }
    ExtensionInfo:
      type: object
      required: [source, name, dependencies, ops, config]
      properties:
        source:
          type: string
          description: Server-local root-name/extension identifier; never a host filesystem path.
          example: contrib/tavily
        name: { type: string }
        version: { type: string }
        description: { type: string }
        icon_url: { type: string, description: Authenticated same-origin packaged PNG endpoint }
        interface:
          type: string
          description: 'Special contract, e.g. llm for provider extensions.'
        models:
          type: array
          items: { type: string }
          description: Default model catalogue declared by a provider extension.
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/CapabilityName' }
        ops:
          type: array
          items: { $ref: '#/components/schemas/OpDoc' }
        config:
          type: array
          items: { $ref: '#/components/schemas/ExtConfigField' }
    ExtensionCatalog:
      type: object
      required: [extensions, remote_enabled, local_enabled]
      properties:
        extensions:
          type: array
          items: { $ref: '#/components/schemas/ExtensionInfo' }
        remote_enabled: { type: boolean }
        local_enabled: { type: boolean }
    APIKey:
      type: object
      required: [id, user_id, name, prefix, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        prefix: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        restricted: { type: boolean, description: true when the key carries an instance spec }
        spec:
          $ref: '#/components/schemas/InstanceSpec'
          description: the instance spec a restricted key may create (absent = full access)
        max_instances: { type: integer, description: live-instance bound for a restricted key }
        view_only: { type: boolean, description: ceiling capped at view — cannot run code }
        instance_id: { type: string, description: when set the key can only reach this instance }
        application_id: { type: string, description: when set the key can only reach this application }
    CreateKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        expires_in_seconds: { type: integer, format: int64 }
        spec:
          $ref: '#/components/schemas/InstanceSpec'
          description: present = restricted key; absent = full access
        max_instances:
          type: integer
          description: required 1..maxPerUser when spec is set; must be absent for full access
        view_only:
          type: boolean
          description: view-only key — sees the workspace's instances, runs and files; cannot run code
        instance_id:
          type: string
          description: bind the key to this instance only; mutually exclusive with spec, view_only and application_id
        application_id:
          type: string
          description: bind the key to this application only (view + invoke); mutually exclusive with spec, view_only and instance_id
    MemberRole:
      type: string
      enum: [viewer, editor, owner]
    Member:
      type: object
      required: [user_id, email, role]
      properties:
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
    MembersResponse:
      type: object
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/Member' }
    MemberResponse:
      type: object
      properties:
        member: { $ref: '#/components/schemas/Member' }
    WorkspaceChange:
      type: object
      required: [id, workspace_id, by_user_id, change, created_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        by_user_id: { type: string }
        change: { type: string }
        user_id: { type: string }
        instance_id: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }
    ChangesResponse:
      type: object
      properties:
        changes:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceChange' }
    Share:
      type: object
      required: [instance_id, user_id, role, created_at]
      properties:
        instance_id: { type: string }
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    SharesResponse:
      type: object
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/Share' }
    ShareResponse:
      type: object
      properties:
        share: { $ref: '#/components/schemas/Share' }
    WorkspaceResponse:
      type: object
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
    SharedInstance:
      type: object
      required: [instance, role]
      properties:
        instance: { $ref: '#/components/schemas/Instance' }
        role: { type: string }
        workspace_name: { type: string }
    Workspace:
      type: object
      required: [id, name, personal, role]
      properties:
        id: { type: string }
        name: { type: string }
        personal: { type: boolean }
        role: { type: string }
    WorkspacesResponse:
      type: object
      properties:
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }
    CreatedKey:
      type: object
      properties:
        key: { $ref: '#/components/schemas/APIKey' }
        secret: { type: string, description: full API key, shown only once }
    KeysResponse:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }
    SecretSpec:
      type: object
      properties:
        ref: { type: string, description: vault secret name (mutually exclusive with value) }
        value: { type: string, description: inline secret value (never persisted) }
        allowed_domains:
          type: array
          items: { type: string }
          description: optional; empty = any host permitted by net allow_hosts
        source: { $ref: '#/components/schemas/SecretSource' }
    Limits:
      type: object
      properties:
        exec_timeout_ms: { type: integer, format: int64 }
        max_steps: { type: integer, format: int64 }
        max_output_bytes: { type: integer, format: int64 }
    InstanceSpec:
      type: object
      properties:
        ttl_seconds: { type: integer, format: int64 }
        labels:
          type: object
          additionalProperties: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        secrets:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SecretSpec' }
        capabilities:
          type: object
          additionalProperties: true
        limits: { $ref: '#/components/schemas/Limits' }
        policies:
          type: array
          description: >-
            Policy names to attach (at most 32), including built-in policies.
            Omitted or null selects the default policies; none of the
            current built-ins are defaults, so this attaches none.
            builtin.block_private_network is opt-in via an explicit list;
            [] selects none.
            Library Rego is snapshotted at creation; server policies
            (--policy-dir) always apply in addition.
          nullable: true
          uniqueItems: true
          maxItems: 32
          items: { $ref: '#/components/schemas/PolicyName' }
    ExecActivity:
      type: object
      properties:
        runs: { type: integer }
        denied_runs: { type: integer }
        failed_runs: { type: integer }
        last_run_at: { type: string, format: date-time }
        last_status: { type: string }
    Instance:
      type: object
      required: [id, user_id, spec, labels, status, created_at, last_active_at, expires_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        workspace_id: { type: string }
        activity:
          $ref: '#/components/schemas/ExecActivity'
          description: run summary — populated on list responses
        spec: { $ref: '#/components/schemas/InstanceSpec' }
        labels:
          type: object
          additionalProperties: { type: string }
        status: { $ref: '#/components/schemas/InstanceStatus' }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    InstanceResponse:
      type: object
      properties:
        instance: { $ref: '#/components/schemas/Instance' }
    InstancesResponse:
      type: object
      properties:
        instances:
          type: array
          items: { $ref: '#/components/schemas/Instance' }
    ExecRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
        timeout_ms: { type: integer, format: int64 }
    ExecError:
      type: object
      required: [type, message]
      properties:
        type: { $ref: '#/components/schemas/ExecErrorType' }
        message: { type: string }
        backtrace: { type: string }
    ExecResult:
      type: object
      required: [exec_id, output, error, duration_ms, steps]
      properties:
        exec_id: { type: string }
        output: { type: string }
        error: { $ref: '#/components/schemas/ExecError', nullable: true }
        duration_ms: { type: integer, format: int64 }
        steps: { type: integer, format: int64 }
    FileEntry:
      type: object
      required: [name, path, is_dir, size, mtime]
      properties:
        name: { type: string }
        path: { type: string }
        is_dir: { type: boolean }
        size: { type: integer, format: int64 }
        mtime: { type: integer, format: int64 }
    InstancePrompt:
      type: object
      required: [instance_id, prompt, capabilities, tools]
      properties:
        instance_id: { type: string }
        prompt: { type: string, description: rendered system prompt (markdown) }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/CapabilityName' }
        tools:
          type: object
          description: tool names the prompt references (prefix applied)
          properties:
            exec: { type: string }
            list_files: { type: string }
            read_file: { type: string }
    FilesResult:
      type: object
      description: either a directory listing or a file's path+content
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/FileEntry' }
        path: { type: string }
        content: { type: string }
    WriteResult:
      type: object
      description: >-
        Upload receipt: normalized virtual path, size, mtime and whether an
        existing file was replaced. Never contains the uploaded contents.
      required: [path, size, mtime, replaced]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        mtime: { type: integer, format: int64 }
        replaced: { type: boolean }
    InstanceInspect:
      type: object
      required: [variables]
      description: live globals snapshot; values are reprs, secret-scrubbed
      properties:
        variables:
          type: object
          additionalProperties: { type: string }
        resources: { $ref: '#/components/schemas/ResourceUsages' }
    ResourceUsages:
      type: object
      required: [memory_usage, memory_peak, memory_max]
      description: >-
        The instance's own cgroup v2 accounting, in bytes. Absent when the
        instance has no group of its own (cgroups unavailable or no
        per-instance memory cap configured on the worker).
      properties:
        memory_usage: { type: integer, format: int64, description: memory.current }
        memory_peak: { type: integer, format: int64, description: memory.peak; 0 when the kernel does not report it }
        memory_max: { type: integer, format: int64, description: memory.max; 0 means unlimited }
    Execution:
      type: object
      required: [id, instance_id, user_id, code_sha256, code_snippet, status, duration_ms, steps, output_bytes, created_at]
      properties:
        id: { type: string }
        instance_id: { type: string }
        user_id: { type: string }
        code_sha256: { type: string }
        code_snippet: { type: string }
        status: { $ref: '#/components/schemas/ExecStatus' }
        error_type: { $ref: '#/components/schemas/ExecErrorType' }
        duration_ms: { type: integer, format: int64 }
        steps: { type: integer, format: int64 }
        output_bytes: { type: integer, format: int64 }
        via:
          $ref: '#/components/schemas/AuthKind'
          description: how the run was authenticated (absent for executions recorded before this field existed)
        created_at: { type: string, format: date-time }
    ExecutionsResponse:
      type: object
      properties:
        executions:
          type: array
          items: { $ref: '#/components/schemas/Execution' }
    ExecutionDetail:
      type: object
      required: [execution, code, output, output_truncated, error]
      properties:
        execution: { $ref: '#/components/schemas/Execution' }
        code: { type: string, description: full submitted code (empty for executions recorded before this field existed) }
        output: { type: string, description: secret-scrubbed run output, capped at 64 KiB }
        output_truncated: { type: boolean, description: true when output was capped }
        error:
          $ref: '#/components/schemas/ExecError'
          nullable: true
          description: structured failure; null when the run completed without error
    AuditEvent:
      type: object
      required: [id, ts, user_id, instance_id, exec_id, capability, op, args, phase, decision, reason, error, duration_ms]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        user_id: { type: string }
        instance_id: { type: string }
        exec_id: { type: string }
        capability: { $ref: '#/components/schemas/CapabilityName' }
        op: { type: string }
        args: { type: string, description: JSON, truncated }
        phase: { $ref: '#/components/schemas/Phase' }
        decision: { $ref: '#/components/schemas/Decision' }
        reason: { type: string }
        error: { type: string }
        duration_ms: { type: integer, format: int64 }
    AuditResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
    Policy:
      type: object
      description: >-
        A selectable policy. Built-in policies are read-only, have no Rego
        source or owner, and use their name as ID. Rego policies belong to
        the user and are snapshotted at instance creation.
      required: [id, name, kind, default]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { $ref: '#/components/schemas/PolicyName' }
        kind: { type: string, enum: [builtin, rego] }
        default: { type: boolean, description: Selected when InstanceSpec.policies is omitted or null. }
        description: { type: string }
        rego: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PolicyName:
      type: string
      description: Unique per user; the builtin. prefix is reserved for read-only built-in policies.
      pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    PolicyRequest:
      type: object
      required: [name, rego]
      properties:
        name: { $ref: '#/components/schemas/PolicyName' }
        rego: { type: string }
    PolicyUpdateRequest:
      type: object
      properties:
        name: { $ref: '#/components/schemas/PolicyName' }
        rego: { type: string }
    PolicyResponse:
      type: object
      properties:
        policy: { $ref: '#/components/schemas/Policy' }
    PoliciesResponse:
      type: object
      properties:
        policies:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
    LLMProvider:
      type: object
      description: >-
        A named provider extension owned by a workspace. The `llm`
        capability extension receives all workspace providers as a
        snapshot at instance creation; scripts choose provider/model per
        call.
      required: [id, name, source, models]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { $ref: '#/components/schemas/PolicyName' }
        source:
          type: string
          description: 'provider extension source, e.g. contrib/llm-openai'
        sum:
          type: string
          description: 'h1: integrity sum (remote sources only)'
        models:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string }
          description: Model ids this provider makes available to the llm extension.
        config:
          type: object
          additionalProperties: true
          description: >-
            effective backend config with defaults applied; api_key stays
            as a {{secrets.NAME}} reference.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LLMProviderRequest:
      type: object
      required: [name, source]
      properties:
        name: { $ref: '#/components/schemas/PolicyName' }
        source: { type: string }
        sum: { type: string }
        models:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string }
        config:
          type: object
          additionalProperties: true
    LLMProviderUpdateRequest:
      type: object
      properties:
        name: { $ref: '#/components/schemas/PolicyName' }
        source: { type: string }
        sum: { type: string }
        models:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string }
        config:
          type: object
          additionalProperties: true
    LLMProviderResponse:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/LLMProvider' }
    LLMProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/LLMProvider' }
    ValidatePolicyRequest:
      type: object
      required: [rego]
      properties:
        rego: { type: string }
    ValidationResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        error: { type: string }
    Secret:
      type: object
      required: [id, user_id, name, allowed_domains, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
          description: optional; empty = any host permitted by net allow_hosts
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateSecretRequest:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string, description: write-only; never returned }
        allowed_domains:
          type: array
          items: { type: string }
          description: optional; empty = any host permitted by net allow_hosts
    UpdateSecretRequest:
      type: object
      properties:
        value: { type: string }
        allowed_domains:
          type: array
          items: { type: string }
          description: optional; empty = any host permitted by net allow_hosts
    SecretResponse:
      type: object
      properties:
        secret: { $ref: '#/components/schemas/Secret' }
    SecretsResponse:
      type: object
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/Secret' }
    # --- applications (EP-0014 durable JSON functions) ---
    RawJSON:
      x-go-type: json.RawMessage
      description: raw JSON preserved byte-for-byte; never re-parsed by the API tier
    ApplicationStatus:
      type: string
      enum: [draft, preparing, ready, degraded, disabled]
    Application:
      type: object
      required: [id, workspace_id, user_id, name, code, spec, version, published_version,
                 status, has_unpublished_changes, created_at, updated_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        user_id: { type: string }
        name: { type: string }
        code: { type: string, description: 'main.star source' }
        spec:
          $ref: '#/components/schemas/RawJSON'
          description: normalized boundary spec (JSON object, refs only)
        spec_json:
          type: string
          description: verbatim stored spec text — high-precision numbers stay exact; use this, never re-serialize spec
        input_schema:
          type: string
          nullable: true
          description: optional pinned JSON Schema text; null = default open object
        output_schema:
          type: string
          nullable: true
        version: { type: integer, format: int64, minimum: 1 }
        published_version: { type: integer, format: int64, minimum: 0 }
        persistent_instance_id: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        release_id: { type: string }
        error_code: { type: string }
        has_unpublished_changes: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApplicationResponse:
      type: object
      properties:
        application: { $ref: '#/components/schemas/Application' }
    ApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items: { $ref: '#/components/schemas/Application' }
    ApplicationCreateRequest:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        code:
          type: string
          nullable: true
          description: omitted/null = scaffold
        spec:
          $ref: '#/components/schemas/RawJSON'
        input_schema:
          type: string
          nullable: true
        output_schema:
          type: string
          nullable: true
    ApplicationUpdateRequest:
      type: object
      required: [version, name, code]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        name: { type: string, maxLength: 128 }
        code: { type: string }
        spec:
          $ref: '#/components/schemas/RawJSON'
        input_schema:
          type: string
          nullable: true
        output_schema:
          type: string
          nullable: true
    ApplicationPublishRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
    ApplicationTestRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        input:
          $ref: '#/components/schemas/RawJSON'
          description: raw JSON input for main(input)
    ApplicationRunResponse:
      type: object
      required: [result]
      properties:
        result:
          x-go-type: rt.ProgramResult
          x-go-type-import: { name: rt, path: calcside/internal/runtime }
        output_json:
          type: string
          description: exact raw JSON output text — UI renders this verbatim, never reparses
        run_id: { type: string }
        run_status: { type: string }
        waiting:
          $ref: '#/components/schemas/InterruptWaiting'
    # --- EP-0016 runs & interrupts ---
    InterruptWaiting:
      type: object
      required: [interrupt_id, console_url]
      properties:
        interrupt_id: { type: string }
        console_url: { type: string }
    Run:
      type: object
      required: [id, application_id, release_id, user_id, trigger, status, steps, created_at, updated_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        release_id: { type: string }
        user_id: { type: string }
        trigger: { type: string }
        status: { type: string }
        steps: { type: integer }
        interrupt_id: { type: string }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            output_json: { type: string }
    RunStep:
      type: object
      required: [seq, attempt, entry, status, duration_ms, started_at]
      properties:
        seq: { type: integer }
        attempt: { type: integer }
        entry: { type: string }
        interrupt_id: { type: string }
        status: { type: string }
        error_code: { type: string }
        duration_ms: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
    Interrupt:
      type: object
      required: [id, run_id, application_id, application_name, status, can_resume, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        application_id: { type: string }
        application_name: { type: string }
        status: { type: string }
        handler: { type: string }
        on_expire: { type: string }
        expires_at: { type: string, format: date-time }
        resolved_by: { type: string }
        resolved_by_label: { type: string }
        resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        can_resume: { type: boolean }
        resume_url: { type: string }
        context_json: { type: string }
        event_json: { type: string }
    RunsResponse:
      type: object
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/Run' }
    RunResponse:
      type: object
      properties:
        run: { $ref: '#/components/schemas/RunDetail' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunStep' }
        interrupts:
          type: array
          items: { $ref: '#/components/schemas/Interrupt' }
    InterruptsResponse:
      type: object
      properties:
        interrupts:
          type: array
          items: { $ref: '#/components/schemas/Interrupt' }
        next_before: { type: string }
    InterruptResponse:
      type: object
      properties:
        interrupt: { $ref: '#/components/schemas/Interrupt' }
    InterruptResumeResponse:
      type: object
      properties:
        status: { type: string }
security:
  - bearerAuth: []
