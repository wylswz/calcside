openapi: 3.0.3
info:
  title: Calcside Worker Protocol
  version: "1.0"
  description: |
    Internal API↔worker protocol. Private network only.

    Every operation is a POST carrying one self-contained request from
    the runtime contract (`internal/runtime`); workers hold no store
    handle and learn nothing outside the request body.

    One operation runs the other direction: `GET /internal/v1/ext/tree`
    is served by the API tier and called by workers to resolve local
    extension sources — workers deliberately have no filesystem roots.

    Authentication is a shared-secret HMAC, not user auth — user
    authentication already happened on the API tier and its result
    travels inside the request as `owner`. The signature covers
    `METHOD\nREQUEST_URI\nUNIX_TS\nSHA256(BODY)`:

    - `X-Calcside-Node`: caller node id
    - `X-Calcside-Time`: unix seconds, ±60s window
    - `X-Calcside-Signature`: hex HMAC-SHA256

    Errors use one envelope: `{"error":{"kind","message"}}`. `kind` is
    the stable token the API tier maps back onto runtime sentinels;
    `message` is the caller-safe text.
paths:
  /runtime/v1/create:
    post:
      operationId: runtimeCreate
      summary: Create a live instance on this node.
      description: >
        The request carries the full instance context — normalized spec,
        policy snapshot, resolved secrets, expiry — and the fencing
        epoch of the placement binding it is created under. Never
        retried by the caller: a node that already holds the instance id
        is expected to fail rather than duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description: Instance created; reports the binding it took.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/exec:
    post:
      operationId: runtimeExec
      summary: Run Starlark on a live instance.
      description: >
        `exec_id` is the idempotency key: the node deduplicates on it and
        replays the recorded result for a repeated request. Exec can
        produce external side effects (secret-bearing net calls), so the
        caller never retries transparently — a duplicate arrives only
        because the first answer was lost in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
      responses:
        '200':
          description: Execution result plus the audit batch it produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/prepare:
    post:
      operationId: runtimePrepare
      summary: Compile and register an ephemeral serving replica on this node.
      description: >
        The request is self-contained: resolved spec, policy snapshot,
        in-memory secret values, labels, owner, fencing epoch, finite
        lease expiry and the immutable program bundle. The replica id is
        an ephemeral identity in the shared namespace, not a development
        or persistent instance. A failed result means no usable replica;
        audit is returned on the 200 response for known engine failures.
        Never transparently retried by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareRequest'
      responses:
        '200':
          description: Prepare outcome; audit always carried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/invoke:
    post:
      operationId: runtimeInvoke
      summary: Run one fenced call against a ready replica.
      description: >
        Release id, generation and epoch must exactly match the prepared
        replica; owner must match exactly and be nonempty. Expired,
        not-ready, stopped or missing replicas reject before any
        capability runs. No transparent retries and no invoke dedup: the
        caller mints a fresh invoke_id per attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: Invoke outcome; audit always carried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/keepalive:
    post:
      operationId: runtimeKeepalive
      summary: Renew the instance's sliding TTL deadline.
      description: Read-only with respect to script state; may be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeepaliveRequest'
      responses:
        '200':
          description: Deadline accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeepaliveResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/delete:
    post:
      operationId: runtimeDelete
      summary: Destroy the live instance and release its resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRequest'
      responses:
        '200':
          description: Instance destroyed (or already gone).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/browse:
    post:
      operationId: runtimeBrowse
      summary: List a directory or read one file in the instance VFS.
      description: Read-only; may be retried. list_only requests never read file contents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowseRequest'
      responses:
        '200':
          description: Listing or redacted file content plus audit batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/export:
    post:
      operationId: runtimeExport
      summary: Atomically collect authorized redacted text artifacts.
      description: >-
        Read-only; may be retried on a stale route. Once an instance is reached,
        operation failures are carried in the 200 response alongside the audit
        batch. A failed collection never returns partial files. File content uses
        base64 transport encoding to bound JSON expansion. An optional preview_mode
        (static or interactive) inlines local HTML dependencies under the same
        execution lock and Gate scope, returning preview_html alongside the entry
        file. Source reads and ordinary exports never perform this conversion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportRequest' }
      responses:
        '200':
          description: Complete bounded snapshot or failure, with audit in both cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportResponse' }
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/prompt:
    post:
      operationId: runtimePrompt
      summary: Render the per-capability prompt fragments for an instance.
      description: Read-only; may be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptRequest'
      responses:
        '200':
          description: Prompt fragments and limits for composition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        default:
          $ref: '#/components/responses/Error'
  /runtime/v1/inspect:
    post:
      operationId: runtimeInspect
      summary: Snapshot a live instance's globals or completion metadata.
      description: Read-only; may be retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'
      responses:
        '200':
          description: Secret-scrubbed reprs, or symbols and env key names when completions_only is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectResponse'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/nodes/register:
    post:
      operationId: nodeRegister
      tags: [api-callback]
      summary: Worker boot registration; returns the assigned incarnation.
      description: >
        Idempotent for the same boot id; a new boot bumps the node's
        incarnation and invalidates every prior fence. ServerNow is the
        API clock sampled at end of response for lease conversion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRegisterRequest'
      responses:
        '200':
          description: Registration outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRegisterResult'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/nodes/sync:
    post:
      operationId: nodeSync
      tags: [api-callback]
      summary: Heartbeat + reports + inventory; returns the full desired set.
      description: >
        Heartbeats the exact node tuple (stale boot -> 409), persists
        report audit before state, renews locally-ready inventory, and
        returns the authoritative assignment set on success only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSyncRequest'
      responses:
        '200':
          description: Authoritative assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSyncResult'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/nodes/prepare:
    post:
      operationId: nodePrepare
      tags: [api-callback]
      summary: Fetch the full self-contained prepare payload for one replica.
      description: >
        Exactly one fenced assignment per fetch; secrets are resolved in
        memory, never persisted or logged. Lease expiry converts via
        ServerNow minus round-trip time at the worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePrepareRequest'
      responses:
        '200':
          description: Prepare payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePrepareResult'
        default:
          $ref: '#/components/responses/Error'
  /internal/v1/ext/tree:
    get:
      operationId: extTree
      tags: [api-callback]
      summary: (worker → API) Fetch a captured extension artifact tree.
      description: >
        Reverse-direction call: the worker asks the API tier for an
        immutable captured extension tree — workers carry no source
        roots and never fetch git/remote sources. The path is the
        source identifier and sum is the required h1 integrity pin;
        the API reads the stored artifact, never a mutable source.
        Signed with the same HMAC scheme.
      parameters:
        - name: path
          in: query
          required: true
          description: Extension source identifier (local root-name/extension or remote source).
          schema:
            type: string
        - name: sum
          in: query
          required: true
          description: Required h1 integrity sum the artifact must match.
          schema:
            type: string
      responses:
        '200':
          description: The source tree and its content sum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtTree'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Error envelope. `kind` maps to a runtime sentinel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [kind, message]
          properties:
            kind:
              type: string
              enum:
                - not_found
                - not_running
                - too_many
                - bad_capability
                - no_capability
                - not_owner
                - bad_spec
                - no_such_path
                - fs_error
                - stale_epoch
                - internal
            message:
              type: string
    ExtTree:
      type: object
      required: [sum, files]
      properties:
        sum:
          type: string
          description: "h1: dirhash of the source tree."
        files:
          type: object
          description: Slash-relative path to file contents.
          additionalProperties:
            type: string
            format: byte
    # Message bodies are owned by the runtime contract package — the
    # spec is authoritative for paths, methods, headers, and the error
    # envelope; the Go types are authoritative for payload shape.
    CreateRequest:
      type: object
      x-go-type: rt.CreateRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    CreateResponse:
      type: object
      x-go-type: rt.CreateResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    ExecRequest:
      type: object
      x-go-type: rt.ExecRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    ExecResponse:
      type: object
      x-go-type: rt.ExecResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    KeepaliveRequest:
      type: object
      x-go-type: rt.KeepaliveRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    KeepaliveResponse:
      type: object
      x-go-type: rt.KeepaliveResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    DeleteRequest:
      type: object
      x-go-type: rt.DeleteRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    DeleteResponse:
      type: object
      x-go-type: rt.DeleteResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    PrepareRequest:
      type: object
      x-go-type: rt.PrepareRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    PrepareResponse:
      type: object
      x-go-type: rt.PrepareResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    InvokeRequest:
      type: object
      x-go-type: rt.InvokeRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    InvokeResponse:
      type: object
      x-go-type: rt.InvokeResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodeRegisterRequest:
      type: object
      x-go-type: rt.NodeRegisterRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodeRegisterResult:
      type: object
      x-go-type: rt.NodeRegisterResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodeSyncRequest:
      type: object
      x-go-type: rt.NodeSyncRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodeSyncResult:
      type: object
      x-go-type: rt.NodeSyncResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodePrepareRequest:
      type: object
      x-go-type: rt.NodePrepareRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    NodePrepareResult:
      type: object
      x-go-type: rt.NodePrepareResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    BrowseRequest:
      type: object
      x-go-type: rt.BrowseRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    BrowseResponse:
      type: object
      x-go-type: rt.BrowseResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    ExportRequest:
      type: object
      x-go-type: rt.ExportRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    ExportResponse:
      type: object
      x-go-type: rt.ExportResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    PromptRequest:
      type: object
      x-go-type: rt.PromptRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    PromptResponse:
      type: object
      x-go-type: rt.PromptResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    InspectRequest:
      type: object
      x-go-type: rt.InspectRequest
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
    InspectResponse:
      type: object
      x-go-type: rt.InspectResponse
      x-go-type-import: {name: rt, path: calcside/internal/runtime}
