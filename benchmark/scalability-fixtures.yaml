# Dedicated namespace-only load-test fixtures; never deploy to production.
# Replace __API_UPSTREAMS__ with "server <pod-ip>:8080;" for each of two API pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalability-fixtures
data:
  delay.py: |
    import http.server
    import time
    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def do_GET(self):
            if self.path == "/delay":
                time.sleep(0.1)
            body = self.client_address[0].encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *args):
            pass
    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
  nginx.conf: |
    worker_processes 2;
    events { worker_connections 2048; }
    http {
      access_log off;
      upstream apis {
        __API_UPSTREAMS__
        keepalive 64;
      }
      server {
        listen 8080;
        location / {
          proxy_pass http://apis;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $http_host;
          proxy_read_timeout 20s;
          proxy_connect_timeout 2s;
          proxy_next_upstream off;
          add_header X-Scalability-API $upstream_addr always;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalability-delay
spec:
  replicas: 1
  selector:
    matchLabels: {app: scalability-delay}
  template:
    metadata:
      labels: {app: scalability-delay}
    spec:
      containers:
        - name: delay
          image: python:3.12-alpine
          command: ["python3", "/fixture/delay.py"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - {name: fixture, mountPath: /fixture, readOnly: true}
      volumes:
        - name: fixture
          configMap: {name: scalability-fixtures}
---
apiVersion: v1
kind: Service
metadata:
  name: scalability-delay
spec:
  selector: {app: scalability-delay}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalability-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: scalability-proxy}
  template:
    metadata:
      labels: {app: scalability-proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          volumeMounts:
            - name: fixture
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: fixture
          configMap: {name: scalability-fixtures}
---
apiVersion: v1
kind: Service
metadata:
  name: scalability-proxy
spec:
  selector: {app: scalability-proxy}
  ports: [{port: 8080, targetPort: 8080}]
