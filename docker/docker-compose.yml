services:
  # Migration runner image: pinned Atlas + the hand-written migrations,
  # baked in by docker/Dockerfile.migrate (same image CI/release publish).
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    image: calcside-migrate:latest
    user: "10001:10001"
    environment:
      HOME: /tmp
      ATLAS_DB_URL: ${ATLAS_DB_URL:-sqlite:///data/calcside.db}
    command: ["migrate", "apply", "--env", "${CALCSIDE_STORE:-sqlite}"]
    volumes:
      - ./data:/data

  calcside:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: calcside:latest
    ports:
      - "8080:8080"
    # User config flows wholesale from docker/.env (run `make
    # docker-env` once, or copy .env.example). Only structural wiring
    # is spelled out below.
    env_file:
      - path: .env
        required: false
    environment:
      CALCSIDE_ADDR: ":8080"
      CALCSIDE_STORE: ${CALCSIDE_STORE:-sqlite}
      CALCSIDE_DSN: ${CALCSIDE_DSN:-/data/calcside.db}
      CALCSIDE_CONSOLE_ORIGIN: ${CALCSIDE_CONSOLE_ORIGIN:-http://localhost:8080}
      # Remote execution tier: worker list nodeID=host:port plus the
      # shared HMAC key both sides must carry.
      CALCSIDE_WORKERS: ${CALCSIDE_WORKERS:-worker-1=worker:8090}
      CALCSIDE_WORKER_SHARED_KEY: ${CALCSIDE_WORKER_SHARED_KEY:?run `make docker-env` first, or set CALCSIDE_WORKER_SHARED_KEY}
      # MCP chart images: the API renders stored validated specs on
      # demand through the private render service (EP-0024).
      CALCSIDE_RENDER_URL: http://render:8091
      CALCSIDE_RENDER_KEY: ${CALCSIDE_RENDER_KEY:?run `make docker-env` first, or set CALCSIDE_RENDER_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
      render:
        condition: service_healthy
    networks:
      - default
      - render-internal
    volumes:
      # Bind mount (host dir docker/data) holds the sqlite db plus all
      # mutable config — copy things straight in:
      #   data/policies  global .rego files (CALCSIDE_POLICY_DIR)
      #   data/ext       local ext capability dirs (CALCSIDE_EXT_LOCAL_ROOTS)
      #   data/ext-cache remote ext fetch cache
      # The image already bundles the community extensions at
      # /opt/calcside/contrib (baked in, read-only).
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Execution node: same image, different entrypoint. Private only —
  # no published port; the API reaches it over the compose network.
  worker:
    image: calcside:latest
    # Starts as root only to delegate a cgroup v2 subtree for per-instance
    # memory limits (CALCSIDE_INSTANCE_MEMORY_MAX, default 64 MiB), then
    # drops to the calcside user — see docker/worker-entrypoint.sh.
    # writable-cgroups (Docker Engine >= 28) mounts only the container's
    # own cgroupfs read-write, instead of privileged / CAP_SYS_ADMIN.
    user: root
    entrypoint: ["worker-entrypoint", "calcside-worker"]
    command: ["serve"]
    cgroup: private
    security_opt:
      - writable-cgroups=true
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    environment:
      CALCSIDE_WORKER_LISTEN: ":8090"
      # Stable identity across container restarts; must match the id
      # the API's CALCSIDE_WORKERS list names for this node.
      CALCSIDE_NODE_ID: worker-1
      CALCSIDE_WORKER_SHARED_KEY: ${CALCSIDE_WORKER_SHARED_KEY:?run `make docker-env` first, or set CALCSIDE_WORKER_SHARED_KEY}
      # Local ext sources are resolved through the API over the shared
      # key — the worker deliberately has no mount of the API's /data.
      # The image ENV sets EXT_LOCAL_ROOTS for the API; clear it here.
      CALCSIDE_API_ADDR: http://calcside:8080
      CALCSIDE_EXT_LOCAL_ROOTS: ""
      CALCSIDE_EXT_CACHE_DIR: /cache/ext
    volumes:
      # The worker's own cache dir (bind-mounted for easy inspection):
      # fetched remote trees and API-resolved local sources. Nothing
      # here is authoritative — safe to wipe.
      - ./worker-cache:/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Stateless Vega-Lite → PNG renderer for MCP chart images (EP-0024).
  # Private only — no published port; it sits on a dedicated internal
  # network with no egress and is reachable only from the API.
  render:
    build:
      context: ../render
      dockerfile: ../docker/Dockerfile.render
    image: calcside-render:latest
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CALCSIDE_RENDER_KEY: ${CALCSIDE_RENDER_KEY:?run `make docker-env` first, or set CALCSIDE_RENDER_KEY}
    networks:
      - render-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  render-internal:
    internal: true
