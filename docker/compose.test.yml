# Isolated release-test stack: never mounts docker/.env or developer data.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calcside
      POSTGRES_DB: calcside
      POSTGRES_PASSWORD: ${TEST_PG_PASSWORD:?generated by the deployment helper}
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calcside -d calcside"]
      interval: 3s
      timeout: 3s
      retries: 60

  migrate:
    image: ghcr.io/wylswz/calcside-migrate:${TEST_IMAGE_TAG:-test}
    user: "10001:10001"
    environment:
      HOME: /tmp
      ATLAS_DB_URL: postgres://calcside:${TEST_PG_PASSWORD}@postgres:5432/calcside?sslmode=disable&search_path=public
    command: ["migrate", "apply", "--env", "postgres"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/wylswz/calcside:${TEST_IMAGE_TAG:-test}
    ports:
      - "127.0.0.1::8080"
    environment:
      CALCSIDE_ADDR: ":8080"
      CALCSIDE_STORE: postgres
      CALCSIDE_DSN: postgres://calcside:${TEST_PG_PASSWORD}@postgres:5432/calcside?sslmode=disable&search_path=public
      CALCSIDE_CONSOLE_ORIGIN: http://localhost:8080
      CALCSIDE_ADMIN_USERNAME: admin
      CALCSIDE_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:?generated by the deployment helper}
      CALCSIDE_SECRET_KEY: ${TEST_VAULT_KEY:?generated by the deployment helper}
      CALCSIDE_WORKERS: worker-1=worker:8090
      CALCSIDE_WORKER_SHARED_KEY: ${TEST_WORKER_KEY:?generated by the deployment helper}
      CALCSIDE_EXEC_MEMORY_LIMIT: "1073741824"
      CALCSIDE_MAX_INSTANCES_PER_USER: "10"
      CALCSIDE_EXT_CACHE_DIR: /data/ext-cache
    mem_limit: 2g
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0750
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 60

  worker:
    image: ghcr.io/wylswz/calcside:${TEST_IMAGE_TAG:-test}
    entrypoint: ["calcside-worker"]
    command: ["serve"]
    environment:
      CALCSIDE_WORKER_LISTEN: ":8090"
      CALCSIDE_NODE_ID: worker-1
      CALCSIDE_WORKER_SHARED_KEY: ${TEST_WORKER_KEY}
      CALCSIDE_API_ADDR: http://api:8080
      CALCSIDE_INSTANCE_ISOLATION: process
      CALCSIDE_INSTANCE_MEMORY_MAX: "0"
      CALCSIDE_EXEC_MEMORY_LIMIT: "1073741824"
      CALCSIDE_EXT_LOCAL_ROOTS: ""
      CALCSIDE_EXT_CACHE_DIR: /cache/ext
    mem_limit: 2g
    tmpfs:
      - /cache:uid=10001,gid=10001,mode=0750
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  postgres:
